[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brainstorm"
version = "0.1.0"
description = "Local-only game brainstorm tool: infinite canvas, projects, todo views"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.7"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.gui-scripts]
brainstorm = "brainstorm.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
brainstorm = ["db/migrations/*.sql", "qml/*.qml", "qml/**/*.qml", "qml/**/qmldir"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
